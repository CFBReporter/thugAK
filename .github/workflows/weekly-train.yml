# Weekly model training -- see src/thugsak/model/train.py.
#
# For each league: replay finished games as of kickoff, refit the settings,
# fit the correction layer, and promote the candidate only if it predicts the
# last three weeks' scores more accurately than the active model. Every run,
# promoted or not, is logged to `model_runs` and shown on the Model page.
# No LLM; no tokens.

name: weekly-train

on:
  schedule:
    # Mondays 11:30 UTC (05:30 CT): after the weekend's finals have landed
    # and before the hourly jobs start their day.
    - cron: "30 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate only; write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Train
        env:
          THUGSAK_DATABASE_URL: ${{ secrets.THUGSAK_DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$THUGSAK_DATABASE_URL" ]; then
            echo "::error::Repository secret THUGSAK_DATABASE_URL is not set"
            exit 1
          fi
          mkdir -p data
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -X utf8 scripts/train_model.py --dry-run
          else
            python -X utf8 scripts/train_model.py
          fi
