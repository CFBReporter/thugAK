# The hourly data jobs, with no LLM -- see src/thugsak/agents/jobs.py.
#
# Replaces the Windows scheduled task that ran the three Claude agents. The
# agents' data came from deterministic tools and their prose reports were
# shown nowhere in the app, so this does the same data work for zero tokens
# and keeps running when the home PC is asleep or offline.
#
# Needs one repository secret: THUGSAK_DATABASE_URL (the Supabase session
# pooler URL). The repo is public and so are these logs: the job prints
# counts and timings only, and the database layer redacts the password from
# every error.

name: hourly-jobs

on:
  schedule:
    # 07:00-01:00 Central = 13:00-07:00 UTC (CST). At :07 past, away from the
    # top-of-hour crush when GitHub delays scheduled runs most. Cron is UTC,
    # so during daylight time (Mar-Nov) the window is 08:00-02:00 Central.
    - cron: "7 13-23 * * *"
    - cron: "7 0-7 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Force the once-a-day tier (player logs, depth charts, retention)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run at a time; a slow run delays the next instead of overlapping it.
  group: hourly-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # Actions pinned to the commit of a release tag, not the movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Run jobs
        env:
          THUGSAK_DATABASE_URL: ${{ secrets.THUGSAK_DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Without the secret the code would quietly fall back to an empty
          # SQLite file on the runner; fail loudly instead.
          if [ -z "$THUGSAK_DATABASE_URL" ]; then
            echo "::error::Repository secret THUGSAK_DATABASE_URL is not set"
            exit 1
          fi
          mkdir -p data
          if [ "${{ inputs.daily }}" = "true" ]; then
            python -X utf8 scripts/run_jobs.py --daily
          else
            python -X utf8 scripts/run_jobs.py
          fi
